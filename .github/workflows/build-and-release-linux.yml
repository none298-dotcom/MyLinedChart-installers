name: Build & Release Linux AppImage
# Website edition AppImage (electron-builder.linux-direct.yml): updates itself
# in the app from latest-linux.yml on the `latest` release, the same release
# the website links to. Builds, launches it on a virtual display (screenshots
# as an artifact), and publishes AppImage + latest-linux.yml only when
# publish=true.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Private-repo branch/tag/SHA to build"
        default: "main"
        required: true
      publish:
        description: "Upload to the `latest` release? 'false' = build and launch only"
        default: "false"
        required: true
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: none298-dotcom/MyLinedChart
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb imagemagick libfuse2t64 x11-utils
      - name: Install
        working-directory: windows-app
        run: npm ci
      - name: Build AppImage (website edition)
        working-directory: windows-app
        run: |
          rm -f build/store-edition.json
          npx electron-builder --config electron-builder.linux-direct.yml --linux AppImage --x64 --publish never
          ls -la dist-linux
          test -f dist-linux/latest-linux.yml
          cat dist-linux/latest-linux.yml
      - name: Launch and screenshot
        working-directory: windows-app
        run: |
          APP=$(ls dist-linux/*.AppImage | head -1)
          chmod +x "$APP"
          mkdir -p shots
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 2
          export DISPLAY=:99
          "$APP" --no-sandbox > shots/stdout.log 2> shots/stderr.log &
          PID=$!
          sleep 45
          import -window root shots/linux-45s.png || true
          if kill -0 $PID 2>/dev/null; then echo "ALIVE after 45s" | tee shots/result.txt; else echo "EXITED" | tee shots/result.txt; exit 1; fi
          kill $PID 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-shots
          path: windows-app/shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-appimage
          path: |
            windows-app/dist-linux/*.AppImage
            windows-app/dist-linux/latest-linux.yml
  publish:
    needs: build
    if: inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-appimage
          path: out
      - name: Upload to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release upload latest out/*.AppImage out/latest-linux.yml --clobber -R ${{ github.repository }}
