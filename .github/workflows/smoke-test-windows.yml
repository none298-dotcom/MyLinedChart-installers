name: Smoke test Windows app

# Windows has been the ONLY platform never actually executed — every Windows fix
# shipped on a code read alone, and two real bugs (a permanently dead in-chart
# Sign In button, and an auth indicator that never updated) survived review
# precisely because nothing ever ran. macOS/iOS/Android can all be run on the dev
# Mac; Windows cannot. A free windows-latest runner can.
#
# This launches the real Electron app on Windows, lets it boot the bundled chart,
# and asserts on the app's own stdout that it got through startup. It does NOT
# need a signed installer — it runs from source, so it can gate a branch before
# anything is published.
#
# Deliberately narrow: it proves "the app starts and the chart bootstraps on
# Windows without crashing". It cannot prove provider fetches (no API keys here).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Private-repo branch/tag/SHA to smoke test"
        default: "main"
        required: true

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout PRIVATE source repo
        uses: actions/checkout@v4
        with:
          repository: none298-dotcom/MyLinedChart
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: windows-app
        run: npm ci

      # Syntax gate first: a parse error would otherwise show up as a confusing
      # "app exited immediately" below.
      - name: Syntax check
        working-directory: windows-app
        run: node --check main.js

      # Business-rule guard: a LAPSED MyLinedChart subscription must still be
      # cut back to demo even when the user's own broker API key keeps working.
      # Tests the real computeDemoGateState out of the shared chart bundle, so it
      # guards all five platforms, not just Windows.
      - name: Entitlement gate truth table
        working-directory: windows-app
        timeout-minutes: 3
        run: node scripts/smoke-demo-gate.js

      # Functional half: does the FILE PIPELINE actually work on Windows?
      # Runs the real shipped import functions against NTFS rename semantics,
      # CRLF CSV and a .xlsx read off disk. timeout-minutes is a hard guard --
      # a sandbox that spins must fail the run, not burn the runner.
      - name: Import pipeline functional test
        working-directory: windows-app
        timeout-minutes: 5
        run: node scripts/smoke-export-import.js

      # The GitHub windows-latest image has an interactive desktop session, so
      # Electron can create its BrowserWindow. Run it detached, give the chart
      # time to load + bootstrap, then stop it and inspect what it logged.
      - name: Launch the app and capture its output
        working-directory: windows-app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $PWD 'smoke-stdout.log'
          $err = Join-Path $PWD 'smoke-stderr.log'
          $electron = Join-Path $PWD 'node_modules\electron\dist\electron.exe'
          if (!(Test-Path $electron)) { throw "electron binary not found at $electron" }
          $p = Start-Process -FilePath $electron -ArgumentList '.' `
                 -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 45
          # ★ SCREENSHOT THE APP BEFORE KILLING IT.
          # Windows is the only platform nobody has ever LOOKED at — every UI
          # claim about it has been inference from stdout. The runner already
          # launches the real app on a real desktop session, so it can also show
          # us what that app looks like. Captured while the process is still
          # alive, then uploaded as an artifact.
          try {
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $shot = Join-Path $PWD 'windows-app-screenshot.png'
            $bmp.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose(); $bmp.Dispose()
            Write-Host "screenshot saved: $shot ($($bounds.Width)x$($bounds.Height))"
          } catch {
            Write-Host "::warning::screenshot capture failed: $($_.Exception.Message)"
          }
          if ($p.HasExited) {
            Write-Host "::error::App exited on its own with code $($p.ExitCode) — it should still be running."
          } else {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          Write-Host "----- stdout -----"; if (Test-Path $out) { Get-Content $out }
          Write-Host "----- stderr -----"; if (Test-Path $err) { Get-Content $err }

      - name: Assert the chart actually bootstrapped
        working-directory: windows-app
        shell: pwsh
        run: |
          $out = if (Test-Path 'smoke-stdout.log') { Get-Content 'smoke-stdout.log' -Raw } else { '' }
          $err = if (Test-Path 'smoke-stderr.log') { Get-Content 'smoke-stderr.log' -Raw } else { '' }
          $all = "$out`n$err"
          # main.js logs this once its ready-probe succeeds and it pushes the
          # bootstrap config -- i.e. the bundled chart's JS is alive.
          if ($all -notmatch 'appPostMessage reroute') {
            Write-Host "::error::Chart never reached the ready probe (no 'appPostMessage reroute' in output)."
            exit 1
          }
          # Any unhandled crash surfaces here.
          if ($all -match 'Uncaught Exception|UnhandledPromiseRejection|A JavaScript error occurred') {
            Write-Host "::error::App logged an unhandled error during startup."
            exit 1
          }
          Write-Host "Windows smoke test passed: app launched and the chart bootstrapped."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-logs
          path: |
            windows-app/smoke-stdout.log
            windows-app/smoke-stderr.log
            windows-app/windows-app-screenshot.png
          if-no-files-found: warn
