name: Build & Release Windows EXE

# Lives in the PUBLIC installers repo (free Actions). It checks out the PRIVATE
# source repo via a read-only token, builds the unsigned NSIS installer on a free
# windows-latest runner, and publishes the .exe to a Release on THIS public repo.
# Source never lands here — only the finished .exe does.
#
# ONE-TIME SETUP (in this public repo's Settings > Secrets and variables > Actions):
#   - Secret  PRIVATE_REPO_TOKEN : a fine-grained PAT with "Contents: Read-only"
#                                   access to none298-dotcom/MyLinedChart.
#
# Then: Actions tab > "Build & Release Windows EXE" > Run workflow.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Private-repo branch/tag/SHA to build from"
        default: "main"
        required: true
      release_tag:
        description: "Release tag to publish the .exe under. 'latest' is what the WEBSITE links to — do not change it without changing the site too."
        default: "latest"
        required: true
  # ★ TEST-ONLY, SCOPED TO build-widget-provider ALONE. workflow_dispatch
  # cannot be run until this file lands on the default branch (see
  # build-and-verify-windows-widget-provider.yml's own trigger comment for
  # the confirmed 404 that motivates this same pattern here), but this file
  # ships a brand-new job that needs a real run before anyone can trust it.
  # `build`'s own `if:` below requires `github.event_name ==
  # 'workflow_dispatch'`, so a pull_request-triggered run executes ONLY
  # build-widget-provider and skips build/sign/publish entirely -- nothing
  # here can build the main installer, sign anything with the production
  # NSIS pipeline, or touch the public Release, no matter what this trigger
  # fires on.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-and-release-windows.yml"
# ★ Security audit 2026-09-13 (SUPPLY-CHAIN-CI-01): permissions are granted per JOB, not to the
# whole run. `npm ci` and electron-builder execute third-party code, so the build job gets read-only
# contents and no OIDC token. Only the sign job can mint an Azure signing token, and only the publish
# job can write a Release. A compromised dependency in the build can no longer sign or publish.
permissions: {}

jobs:
  # ★ Windows 11 Widgets Board watchlist provider -- BEST-EFFORT, ISOLATED JOB.
  #
  # See the private source repo's windows/README.md and windows/Package/AppxManifest.xml
  # for the full design. This job builds the small C# COM server
  # (windows/WidgetProvider/), signs it and the sparse MSIX with the SAME Azure
  # Trusted Signing certificate that signs the main .exe below, and uploads the
  # result as an artifact for the `build` job to bundle -- proven end to end
  # (build, pack, sign, Add-AppxPackage register/deregister, and the same round
  # trip via a real NSIS install/uninstall) in
  # build-and-verify-windows-widget-provider.yml.
  #
  # `continue-on-error: true` is load-bearing, not decoration: a widget-provider
  # regression (a Windows App SDK version bump, a signing hiccup, anything) must
  # NEVER block shipping the main desktop app, which is the whole reason this is
  # a separate job rather than a step inside `build`. When this job fails, GitHub
  # still reports its own conclusion as failure in the Actions UI (so a real
  # regression is visible), but `needs: build-widget-provider` in the `build` job
  # below proceeds anyway and simply ships without a widget that run -- see that
  # job's own "Fetch the signed widget provider" step for exactly how it detects
  # which case it's in.
  build-widget-provider:
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write   # Azure OIDC federated login for Trusted Signing -- no stored secret
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    outputs:
      built: ${{ steps.status.outputs.built }}
    steps:
      - name: Checkout PRIVATE source repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: none298-dotcom/MyLinedChart
          # inputs.ref is unset on the test-only pull_request trigger (see
          # this workflow's own `on:` comment) -- falls back to the branch
          # this widget work actually lives on.
          ref: ${{ inputs.ref || 'windows-watchlist-widget' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup .NET (pinned by windows/WidgetProvider/global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        # msbuild, NOT `dotnet build` -- see MyLinedChartWidgetProvider.csproj's
        # own header for why (the Windows App SDK's MRT targets need Visual
        # Studio's Appx tooling, which the dotnet SDK alone does not carry).
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Locate Windows SDK tools (makeappx, signtool)
        id: sdktools
        shell: pwsh
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $makeappx = Get-ChildItem $sdkRoot -Recurse -Filter "makeappx.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\x64\*" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found under $sdkRoot" }
          "makeappx=$($makeappx.FullName)" >> $env:GITHUB_OUTPUT

      - name: Restore + publish the widget provider
        shell: pwsh
        run: |
          msbuild windows\WidgetProvider\MyLinedChartWidgetProvider.csproj `
            /restore /t:Publish /p:Configuration=Release `
            /p:PublishDir=$PWD\windows\WidgetProvider\publish\ `
            /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "windows\WidgetProvider\publish\MyLinedChartWidgetProvider.exe")) { throw "publish did not produce the provider exe" }

      - name: Azure login (federated / OIDC)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the widget provider exe (Azure Trusted Signing, same cert as the main app)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          files: ${{ github.workspace }}\windows\WidgetProvider\publish\MyLinedChartWidgetProvider.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Stamp AppxManifest.xml (Version from the app, Publisher from the real cert)
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature windows\WidgetProvider\publish\MyLinedChartWidgetProvider.exe
          if ($sig.Status -ne 'Valid') { throw "Provider exe is not validly signed ($($sig.Status))" }
          node windows\Package\scripts\stamp-appx-identity.cjs --manifest windows\Package\AppxManifest.xml --publisher $sig.SignerCertificate.Subject
          if ($LASTEXITCODE -ne 0) { throw "stamp-appx-identity.cjs failed with exit code $LASTEXITCODE" }

      - name: Pack the sparse MSIX
        shell: pwsh
        env:
          MAKEAPPX: ${{ steps.sdktools.outputs.makeappx }}
        run: |
          New-Item -ItemType Directory -Path windows\Package\dist -Force | Out-Null
          & $env:MAKEAPPX pack /d windows\Package /p windows\Package\dist\MyLinedChartWidgets.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed with exit code $LASTEXITCODE" }

      - name: Sign the sparse MSIX (Azure Trusted Signing, same cert as the main app)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          files: ${{ github.workspace }}\windows\Package\dist\MyLinedChartWidgets.msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify both signatures landed, then mark this job's output built
        id: status
        shell: pwsh
        run: |
          $exeSig = Get-AuthenticodeSignature windows\WidgetProvider\publish\MyLinedChartWidgetProvider.exe
          $msixSig = Get-AuthenticodeSignature windows\Package\dist\MyLinedChartWidgets.msix
          if ($exeSig.Status -ne 'Valid' -or $msixSig.Status -ne 'Valid') {
            throw "Provider exe signature: $($exeSig.Status); sparse MSIX signature: $($msixSig.Status) -- refusing to ship an unsigned/invalid widget provider."
          }
          "built=true" >> $env:GITHUB_OUTPUT
          Write-Host "Widget provider built and signed."

      - name: Upload the signed widget provider bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: widget-provider-bundle
          path: |
            windows/WidgetProvider/publish/**
            windows/Package/dist/MyLinedChartWidgets.msix
          if-no-files-found: error
          retention-days: 1

  build:
    needs: build-widget-provider
    # ★ TWO conditions, both load-bearing:
    #   !cancelled() -- must run even if build-widget-provider failed outright
    #     (its own continue-on-error: true keeps the WORKFLOW from failing over
    #     it, but a job's default `if` still gates on its needs succeeding, and
    #     belt-and-suspenders costs nothing here) -- a widget-provider
    #     regression must never block shipping the main desktop app.
    #   github.event_name == 'workflow_dispatch' -- this workflow's own test-only
    #     pull_request trigger (see the `on:` block's comment) exists ONLY to
    #     give build-widget-provider a real pre-merge run; build/sign/publish
    #     must never run, build a real installer, or touch the public Release
    #     from a pull_request event.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PRIVATE source repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: none298-dotcom/MyLinedChart
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      # ★ Best-effort per build-widget-provider's own header: only fetched
      # when that job actually succeeded (continue-on-error there means its
      # own conclusion never blocks this `needs:`, so `outputs.built` is what
      # tells this job which case it's in). windows-app/scripts/
      # stage-widget-provider.js (run by predist:win, below) looks for these
      # exact paths and quietly ships without a widget provider if either is
      # missing -- see that script's own comment for why that is a working
      # build, not a failed one.
      - name: Fetch the signed widget provider (best-effort)
        if: ${{ needs.build-widget-provider.outputs.built == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: widget-provider-bundle
          path: windows

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-app/package-lock.json

      - name: Install dependencies
        working-directory: windows-app
        run: npm ci

      # ⛔ WITHOUT THIS, EVERY RELEASE BUILD FAILS BEFORE IT COMPILES.
      #
      # The 36MB Connector zip used to be committed under web/public/. It moved
      # to R2 on 2026-08-31 for the Cloudflare Workers migration (Workers cannot
      # serve a file that size from web/public/), and nothing here was updated to
      # go and get it. windows-app/scripts/extract-connector.js still expects it
      # at .build/connectors/, so `npm run dist:win` has died in its predist step
      # ever since:
      #
      #     [extract-connector] Missing zip: ...\.build\connectors\...
      #
      # The version is read from windows-app/package.json rather than pinned, so
      # a version bump cannot silently keep shipping an older Connector. If R2
      # has no zip for that version the download fails loudly here, which is the
      # correct outcome — a release built without its Connector would install an
      # app whose IBKR path is simply missing.
      - name: Fetch the bundled Connector from R2
        shell: bash
        run: |
          set -euo pipefail
          # ⚠ The CONNECTOR has its own version, not the app's. Deriving this
          # from windows-app/package.json (as the first version of this step did)
          # couples them, so bumping the app to 1.0.12 would send CI looking for
          # /connectors/1.0.12/ — which does not exist, because the Connector did
          # not change. web/lib/downloads.ts is the single source of truth for
          # this URL; the website serves the same file from the same constant.
          url="$(node -e "
            const fs = require('fs');
            const src = fs.readFileSync('web/lib/downloads.ts', 'utf8');
            const m = src.match(/WINDOWS_CONNECTOR_ZIP_PATH\s*=\s*[\"']([^\"']+)[\"']/);
            if (!m) { console.error('WINDOWS_CONNECTOR_ZIP_PATH not found in web/lib/downloads.ts'); process.exit(1); }
            console.log(m[1]);
          ")"
          dest=".build/connectors/MyLinedChart-IBKRConnector-Windows.zip"
          mkdir -p "$(dirname "$dest")"
          echo "Fetching Connector from $url"
          curl -fsSL --retry 3 --retry-delay 5 -o "$dest" "$url"
          # A 200 is not proof of a zip -- a misconfigured bucket happily returns
          # an HTML error page with one, and extract-zip's failure two steps later
          # would not name the cause. Check the magic bytes and a sane size here.
          size="$(wc -c < "$dest")"
          test "$size" -gt 1000000 || { echo "Connector zip is only ${size} bytes -- not a real archive"; exit 1; }
          head -c 2 "$dest" | grep -q 'PK' || { echo "Downloaded file is not a zip (no PK header)"; head -c 200 "$dest"; exit 1; }
          echo "Connector staged: ${size} bytes"

      - name: Build NSIS installer (.exe)
        working-directory: windows-app
        # predist:win extracts the bundled connector, then electron-builder makes the x64 NSIS installer
        run: npm run dist:win
        env:
          # electron-builder still packages UNSIGNED and never hunts for a cert;
          # the Trusted Signing step below signs the finished .exe. Keeping the
          # two separate means a signing failure cannot corrupt the package.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # ★ No rename step any more. electron-builder's `artifactName` produces
      # MyLinedChart-Windows-Setup.exe directly, because latest.yml names the
      # file it expects to download -- renaming afterwards pointed every client
      # at a 404.
      - name: Locate the installer
        id: pkg
        shell: bash
        run: |
          out="windows-app/dist/MyLinedChart-Windows-Setup.exe"
          test -f "$out" || { echo "expected $out from electron-builder"; ls -la windows-app/dist; exit 1; }
          echo "exe=$out" >> "$GITHUB_OUTPUT"
          echo "Built: $out"

      - name: Hand the unsigned installer to the sign job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-installer
          path: |
            windows-app/dist/MyLinedChart-Windows-Setup.exe
            windows-app/dist/latest.yml
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: windows-latest
    permissions:
      id-token: write        # OIDC token for Azure Trusted Signing (no stored secret)
    # `secrets` is not valid in a step-level `if:`; a job env var lets a step ask whether signing is configured.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: Receive the unsigned installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-installer
          path: windows-app/dist

      # ★ Authenticode-sign with Azure Trusted Signing.
      # Signs with the SHORT-LIVED cert Azure mints per run under the
      # mlc-public-trust profile -- nothing to install, renew or store here.
      # Auth is OIDC/federated: the runner exchanges a GitHub token for an Azure
      # one, so this PUBLIC repo holds NO long-lived credential. The three
      # AZURE_* secrets are identifiers, not passwords.
      # Skips cleanly if the secrets are absent, so a fork or a
      # credential-less run still produces the unsigned installer it used to.
      # trusted-signing-action authenticates via DefaultAzureCredential, which
      # has no idea about GitHub OIDC on its own — the first run fell through
      # every credential in the chain (CLI, Developer CLI, Visual Studio...) and
      # died with "SignerSign() failed". azure/login performs the federated token
      # exchange and leaves the runner in a state DefaultAzureCredential can use.
      - name: Azure login (federated / OIDC)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer (Azure Trusted Signing)
        id: sign
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          # ⚠ MUST be absolute: the signing client rejects a relative path
          # outright with "The file path '...' is not rooted." The rename step
          # always produces this exact filename, so this stays deterministic.
          files: ${{ github.workspace }}\windows-app\dist\MyLinedChart-Windows-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ★★ RE-HASH latest.yml AFTER SIGNING.
      #
      # electron-builder writes latest.yml (version + sha512 + size) at package
      # time, and the Trusted Signing step above then REWRITES the .exe. The
      # manifest therefore describes bytes that no longer exist, and
      # electron-updater verifies sha512 before installing -- so every client
      # would download the update and refuse it as corrupt. Recompute from the
      # signed file, which is the only artifact anyone actually downloads.
      #
      # The .blockmap is deliberately NOT regenerated or published: it only
      # enables differential downloads, it is equally invalidated by signing,
      # and electron-updater falls back to a full download when it is absent.
      - name: Re-hash latest.yml against the SIGNED installer
        shell: pwsh
        run: |
          $exe = "windows-app/dist/MyLinedChart-Windows-Setup.exe"
          $yml = "windows-app/dist/latest.yml"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $sha = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::Create().ComputeHash($bytes))
          $size = $bytes.Length
          $text = Get-Content $yml -Raw
          $text = [System.Text.RegularExpressions.Regex]::Replace($text, 'sha512: .*', "sha512: $sha")
          $text = [System.Text.RegularExpressions.Regex]::Replace($text, 'size: .*', "size: $size")
          Set-Content -Path $yml -Value $text -NoNewline
          Write-Host "--- latest.yml (post-sign) ---"
          Get-Content $yml
          Remove-Item "$exe.blockmap" -ErrorAction SilentlyContinue

      - name: Verify the signature landed
        shell: pwsh
        run: |
          $exe = "windows-app/dist/MyLinedChart-Windows-Setup.exe"
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Status : $($sig.Status)"
          Write-Host "Signer : $($sig.SignerCertificate.Subject)"
          # ★ Security audit 2026-09-13 (SUPPLY-CHAIN-CI-04): this was a warning, and the
          # publish step below still ran, so an unsigned installer could overwrite
          # `latest` and reach every Windows install through electron-updater. An
          # installer that is not validly signed now stops the job before publishing.
          if ($sig.Status -ne 'Valid') {
            Write-Host "::error::Installer is NOT validly signed ($($sig.Status)); refusing to publish."
            exit 1
          }

      - name: Hand the SIGNED installer to the publish job (also kept as a run artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MyLinedChart-Windows-Setup
          path: |
            windows-app/dist/MyLinedChart-Windows-Setup.exe
            windows-app/dist/latest.yml
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create/update the Release on this public repo
    steps:
      - name: Receive the signed installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MyLinedChart-Windows-Setup
          path: dist

      - name: Publish to public Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Inputs reach the shell as environment variables, never pasted into the script
          # (security audit 2026-09-13, SUPPLY-CHAIN-CI-05).
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$RELEASE_TAG"
          exe="dist/MyLinedChart-Windows-Setup.exe"
          # create the release if the tag doesn't exist yet, else just (re)upload the asset
          yml="dist/latest.yml"
          # latest.yml IS the update feed. Publishing the .exe without it means
          # no installed app ever learns a new version exists.
          gh release create "$tag" "$exe" "$yml" \
            --repo "${{ github.repository }}" \
            --title "MyLinedChart Windows" \
            --notes "Authenticode-signed by Little Bird Trading LLC via Azure Trusted Signing." \
            || gh release upload "$tag" "$exe" "$yml" --clobber --repo "${{ github.repository }}"
          echo "Published $exe and $yml to release '$tag'"
