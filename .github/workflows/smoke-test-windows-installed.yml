name: Smoke test INSTALLED Windows app

# ★ WHY THIS EXISTS — Microsoft failed certification on 2026-07-30 with
# "10.1.2.10 Functionality — The product crashes at launch", while our existing
# smoke test was green on every build.
#
# Both can be true, because they test DIFFERENT THINGS:
#   smoke-test-windows.yml  ->  node_modules\electron\dist\electron.exe .
#                               i.e. Electron run against the SOURCE FOLDER.
#   Microsoft               ->  install the .exe, then run the INSTALLED binary.
#
# Everything that only exists after packaging — asar packing, extraResources
# copying, resourcesPath layout, files: globs in electron-builder.yml — is
# invisible to the source run and fatal to the installed one. We had no test
# covering the artifact we actually ship.
#
# This workflow does what the certifier does: silent-install, launch the
# installed exe, and prove it is still alive. It also collects the Windows
# Application event log, because an Electron main-process throw at startup
# leaves an Application Error / .NET Runtime entry there and nowhere else.
#
# ★★ 2026-08-06 EXTENSION — "still alive" is not "works". Microsoft rejected
# this app's Store submission THREE times; twice the cause was a "Sign up"
# button that did nothing at all. The chart posts a bridge message
# (desktopAuthFlow / start_signup), the Windows shell had no handler for it,
# the message was silently dropped, and the button did not respond to user
# input. That is now fixed in windows-app/main.js's
# ipcMain.on('mlc-app-message') handler, but NOTHING had ever actually
# clicked the button end to end to prove it — every check above this point
# only proves the process launches and a window is visible, which was
# exactly what stayed green on both rejected builds.
#
# The steps below launch the installed app with --remote-debugging-port,
# click the real "Sign up" control over the Chrome DevTools Protocol (a DOM
# click, not a coordinate click and not a direct call into the handler), and
# assert on the app's own stdout that startDesktopSignIn() logged a sign-in
# URL carrying /signup and a PKCE code_challenge/code_challenge_method=S256.
# PKCE is the OTHER half of why Windows sign-in was broken: the server
# rejects any desktop auth exchange that arrives without it, which surfaced
# to users as "your app version is out of date" even after a browser opened.

on:
  workflow_dispatch:
    inputs:
      exe_url:
        description: "Direct URL of the installer to test (defaults to the beta release asset)"
        # ★ `latest` is the only release tag now. The "beta" tag was retired on
        # 2026-08-03 because the site downloaded from `latest` while the build
        # workflows published to `beta`, so the site served a stale EXE for two
        # days. A smoke test defaulting to the dead tag would happily certify an
        # installer nobody ships.
        default: "https://github.com/none298-dotcom/MyLinedChart-installers/releases/download/latest/MyLinedChart-Windows-Setup.exe"
        required: false
      wait_seconds:
        description: "How long to let the app run before judging it alive"
        default: "40"
        required: false
      runner:
        description: "Runner image — the NSIS System.dll crash may be OS-specific"
        default: "windows-latest"
        required: false
        type: choice
        options: ["windows-latest", "windows-2022", "windows-2025"]

permissions:
  contents: read

jobs:
  installed-smoke:
    runs-on: ${{ inputs.runner || 'windows-latest' }}
    steps:
      - name: Report the runner OS
        shell: pwsh
        run: |
          Write-Host (Get-CimInstance Win32_OperatingSystem | Select-Object -ExpandProperty Caption)
          Write-Host "build: $([System.Environment]::OSVersion.Version)"

      - name: Download the installer
        shell: pwsh
        run: |
          $url = "${{ inputs.exe_url }}"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile setup.exe -UseBasicParsing
          $f = Get-Item setup.exe
          Write-Host ("installer: {0:N0} bytes ({1:N1} MB)" -f $f.Length, ($f.Length/1MB))
          if ($f.Length -lt 1MB) { throw "Installer suspiciously small - did the URL redirect to an error page?" }

      - name: Verify it is Authenticode signed
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature .\setup.exe
          Write-Host "status : $($sig.Status)"
          Write-Host "signer : $($sig.SignerCertificate.Subject)"
          # Not fatal: an unsigned build is still worth crash-testing, and the
          # signing status is checked properly by the release workflow.
          if ($sig.Status -ne 'Valid') { Write-Host "::warning::signature is $($sig.Status)" }

      - name: Silent install (exactly what the Store certifier runs)
        shell: pwsh
        run: |
          # /S is uppercase - NSIS is case sensitive and lowercase silently opens
          # the interactive installer instead, which then hangs the job.
          $p = Start-Process -FilePath .\setup.exe -ArgumentList '/S' -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Silent install failed with exit code $($p.ExitCode)" }

      # ★★ The two things Microsoft certification actually checks. Added after
      # the 2026-08-03 rejection, which failed BOTH:
      #   10.1.2.10  "no accessible method of being launched"
      #   10.2.7     "no entry in the Add or Remove Programs list"
      # Neither was an app defect — the installer was per-user, so shortcuts and
      # the uninstall key lived in the installing user's profile where a
      # certifier inspecting the machine never saw them. Asserting both here is
      # the only way to know the fix holds without waiting days for a re-review.
      - name: Assert a Start Menu shortcut exists (policy 10.1.2.10)
        shell: pwsh
        run: |
          $roots = @(
            "$env:ProgramData\Microsoft\Windows\Start Menu\Programs",
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
          )
          $found = @()
          foreach ($r in $roots) {
            if (-not (Test-Path $r)) { continue }
            $found += Get-ChildItem $r -Recurse -Filter 'MyLinedChart*.lnk' -ErrorAction SilentlyContinue
          }
          if (-not $found) {
            Write-Host "::error::No MyLinedChart Start Menu shortcut. This is exactly what certification 10.1.2.10 rejected."
            foreach ($r in $roots) { if (Test-Path $r) { Write-Host "--- $r"; Get-ChildItem $r -Recurse -Filter '*.lnk' -EA SilentlyContinue | Select-Object -First 25 FullName } }
            exit 1
          }
          $found | ForEach-Object { Write-Host "shortcut: $($_.FullName)" }
          # ALL USERS is what a certifier sees. A shortcut only under APPDATA is
          # the per-user install that failed, so warn loudly rather than pass.
          $allUsers = $found | Where-Object { $_.FullName -like "$env:ProgramData*" }
          if (-not $allUsers) {
            Write-Host "::error::Shortcut exists only in the per-user Start Menu. perMachine must be true."
            exit 1
          }

      - name: Assert an Add or Remove Programs entry exists (policy 10.2.7)
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $entry = $null
          foreach ($k in $keys) {
            $entry = Get-ItemProperty $k -ErrorAction SilentlyContinue |
                     Where-Object { $_.DisplayName -like '*MyLinedChart*' } | Select-Object -First 1
            if ($entry) { break }
          }
          if (-not $entry) {
            Write-Host "::error::No HKLM uninstall entry. This is exactly what certification 10.2.7 rejected."
            Write-Host "--- HKCU (where a per-user install would have written it) ---"
            Get-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue |
              Where-Object { $_.DisplayName -like '*MyLinedChart*' } |
              Select-Object DisplayName,UninstallString | Format-List
            exit 1
          }
          Write-Host "ARP DisplayName:     $($entry.DisplayName)"
          Write-Host "ARP UninstallString: $($entry.UninstallString)"
          if (-not $entry.UninstallString) {
            Write-Host "::error::Uninstall entry has no UninstallString — nothing for the user to run."
            exit 1
          }

      - name: Locate the installed binary
        id: locate
        shell: pwsh
        run: |
          # electron-builder NSIS defaults to a per-user install under LOCALAPPDATA.
          # Search both that and Program Files so a config change does not silently
          # turn this step into a false pass.
          $roots = @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}")
          $exe = $null
          foreach ($r in $roots) {
            if (-not (Test-Path $r)) { continue }
            $hit = Get-ChildItem $r -Recurse -Filter 'MyLinedChart.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $exe = $hit.FullName; break }
          }
          if (-not $exe) {
            Write-Host "::error::Installed MyLinedChart.exe not found after a successful install."
            foreach ($r in $roots) { if (Test-Path $r) { Get-ChildItem $r -ErrorAction SilentlyContinue | Select-Object -First 20 | Format-Table Name } }
            exit 1
          }
          Write-Host "installed exe: $exe"
          "exe=$exe" >> $env:GITHUB_OUTPUT
          $dir = Split-Path $exe -Parent
          Write-Host "--- resources\ (what actually shipped) ---"
          Get-ChildItem (Join-Path $dir 'resources') -ErrorAction SilentlyContinue | Format-Table Name,Length

      - name: Launch the INSTALLED app and prove it stays alive
        shell: pwsh
        run: |
          $exe = "${{ steps.locate.outputs.exe }}"
          $wait = [int]"${{ inputs.wait_seconds }}"
          $out = Join-Path $PWD 'installed-stdout.log'
          $err = Join-Path $PWD 'installed-stderr.log'
          # ELECTRON_ENABLE_LOGGING surfaces renderer console output on stderr,
          # which is where a bundled-chart failure shows up.
          $env:ELECTRON_ENABLE_LOGGING = "1"
          # ★ --remote-debugging-port opens the Chrome DevTools Protocol on the
          # INSTALLED, PACKAGED exe -- the same binary the certifier runs, not
          # a dev/source build. This is a standard Chromium/Electron switch
          # handled before any of the app's own JS runs, so packaging does not
          # disable it; it is what lets the step below click the real "Sign
          # up" button instead of trusting that it works.
          $p = Start-Process -FilePath $exe -ArgumentList '--remote-debugging-port=9222' -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds $wait

          $alive = -not $p.HasExited
          Write-Host "still running after ${wait}s: $alive"

          try {
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $PWD 'installed-app.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          } catch { Write-Host "::warning::screenshot failed: $($_.Exception.Message)" }

            # ★★ A VISIBLE WINDOW, not just a live process. The app now uses
            # show:false + 'ready-to-show' so launch does not flash an empty
            # window. That is a real improvement AND a real hazard: if
            # ready-to-show never fires, the process lives forever with NOTHING
            # on screen and every check above still passes. MainWindowHandle is
            # 0 until a window is actually shown, so this is what separates
            # "running" from "the user can see it".
            $p.Refresh()
            Write-Host "main window handle: $($p.MainWindowHandle)"
            Write-Host "main window title:  $($p.MainWindowTitle)"
            if ($alive -and $p.MainWindowHandle -eq 0) {
              Write-Host "::error::Running but NO visible window (MainWindowHandle=0). A ready-to-show that never fires looks exactly like this."
              exit 1
            }

          # ★★ Click "Sign up" over the Chrome DevTools Protocol and prove the
          # bridge actually fires. WHY THIS EXISTS: on TWO separate Store
          # rejections, the certifier hit a "Sign up" button that did nothing
          # -- the chart posted a bridge message, nothing on the Windows side
          # had a case for it, and the click was silently swallowed. Every
          # check up to this point (alive, visible window, no fatal dialog)
          # was ALSO green on both of those rejected builds, so none of it
          # would have caught this. This is the one check that actually
          # presses the button.
          #
          # This drives the REAL path end to end: a DOM click on the actual
          # auth-gate control -> the chart's requestDesktopSignupFlow() ->
          # the WKWebView-shaped window.webkit.messageHandlers.app.postMessage
          # shim installed by preload.js -> ipcRenderer.send('mlc-app-message')
          # -> the ipcMain.on('mlc-app-message') handler in main.js ->
          # startDesktopSignIn(SIGNUP_PATH). Calling the handler directly, or
          # evaluating the URL builder in isolation, would prove nothing about
          # the wiring that actually broke -- it has to go through the DOM,
          # same as a real user's click does.
          function Invoke-CdpEval {
            param(
              [Parameter(Mandatory = $true)][string]$WebSocketUrl,
              [Parameter(Mandatory = $true)][string]$Expression,
              [int]$TimeoutSeconds = 15
            )
            $requestId = 9001
            $ws = New-Object System.Net.WebSockets.ClientWebSocket
            $connectCts = New-Object System.Threading.CancellationTokenSource ([TimeSpan]::FromSeconds($TimeoutSeconds))
            $ws.ConnectAsync([Uri]$WebSocketUrl, $connectCts.Token).GetAwaiter().GetResult()
            try {
              $command = @{
                id     = $requestId
                method = 'Runtime.evaluate'
                params = @{ expression = $Expression; returnByValue = $true; awaitPromise = $false }
              }
              $json = $command | ConvertTo-Json -Depth 10 -Compress
              $sendBytes = [System.Text.Encoding]::UTF8.GetBytes($json)
              $sendSeg = New-Object System.ArraySegment[byte] (, $sendBytes)
              $ws.SendAsync($sendSeg, [System.Net.WebSockets.WebSocketMessageType]::Text, $true, $connectCts.Token).GetAwaiter().GetResult() | Out-Null

              $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
              while ((Get-Date) -lt $deadline) {
                $recvBuffer = New-Object byte[] 262144
                $recvSeg = New-Object System.ArraySegment[byte] (, $recvBuffer)
                $recvCts = New-Object System.Threading.CancellationTokenSource ([TimeSpan]::FromSeconds(5))
                $recvResult = $ws.ReceiveAsync($recvSeg, $recvCts.Token).GetAwaiter().GetResult()
                $recvText = [System.Text.Encoding]::UTF8.GetString($recvBuffer, 0, $recvResult.Count)
                if ([string]::IsNullOrWhiteSpace($recvText)) { continue }
                $recvMsg = $recvText | ConvertFrom-Json
                # The socket also carries unrelated CDP events (Page/Network/etc.)
                # ahead of our reply -- skip anything that is not our own request id.
                if ($null -ne $recvMsg.id -and $recvMsg.id -eq $requestId) {
                  return $recvMsg
                }
              }
              throw "Timed out waiting for a Runtime.evaluate response over CDP."
            } finally {
              try {
                $ws.CloseAsync([System.Net.WebSockets.WebSocketCloseStatus]::NormalClosure, 'done', [System.Threading.CancellationToken]::None).GetAwaiter().GetResult()
              } catch { }
              $ws.Dispose()
            }
          }

          # Matches the chart's own two "Sign up" controls (the auth gate's
          # authGateSignUpButton and a trial-CTA button with identical text) by
          # trimmed textContent, exactly as this task specified, then narrows
          # to VISIBLE elements and prefers the auth-gate button by id -- an
          # element that "matches" but is hidden behind another panel is not a
          # click a real user could make, and must not count as a pass.
          # ★ Written as ONE line, not a PowerShell here-string: a here-string
          # terminator (`'@`) must sit at column 0 with no leading whitespace,
          # which is incompatible with this whole script being YAML block-
          # scalar content indented under `run: |` -- an indented here-string
          # here breaks the YAML parse, not just the PowerShell.
          $signupClickExpression = '(function(){var candidates=Array.prototype.slice.call(document.querySelectorAll("button, [role=button], a"));var matches=candidates.filter(function(el){return (el.textContent||"").trim()==="Sign up";});var visible=matches.filter(function(el){return !!(el.offsetParent||(el.getClientRects&&el.getClientRects().length));});var target=visible.filter(function(el){return el.id==="authGateSignUpButton";})[0]||visible[0];if(!target){return JSON.stringify({found:false,totalTextMatches:matches.length,visibleTextMatches:visible.length});}target.click();return JSON.stringify({found:true,id:target.id||null,totalTextMatches:matches.length,visibleTextMatches:visible.length});})()'

          if ($alive) {
            $devtoolsReady = $false
            $pageTarget = $null
            $devtoolsDeadline = (Get-Date).AddSeconds(30)
            Write-Host "Waiting for the DevTools endpoint at http://127.0.0.1:9222/json to list a page target..."
            while ((Get-Date) -lt $devtoolsDeadline) {
              try {
                $targets = Invoke-RestMethod -Uri 'http://127.0.0.1:9222/json' -UseBasicParsing -TimeoutSec 3
                $pageTarget = $targets | Where-Object { $_.type -eq 'page' -and $_.webSocketDebuggerUrl } | Select-Object -First 1
                if ($pageTarget) { $devtoolsReady = $true; break }
              } catch {
                # Port not listening yet, or no page target registered yet -- keep polling.
              }
              Start-Sleep -Seconds 1
            }
            "DEVTOOLS_READY=$devtoolsReady" >> $env:GITHUB_ENV

            $signupClicked = $false
            $signupClickDetail = '(devtools never became ready)'
            if ($devtoolsReady) {
              Write-Host "DevTools page target: $($pageTarget.url)"
              try {
                $evalResult = Invoke-CdpEval -WebSocketUrl $pageTarget.webSocketDebuggerUrl -Expression $signupClickExpression -TimeoutSeconds 15
                if ($evalResult.error) {
                  throw "Runtime.evaluate returned a protocol error: $($evalResult.error | ConvertTo-Json -Compress)"
                }
                $rawValue = $evalResult.result.result.value
                Write-Host "Runtime.evaluate result: $rawValue"
                $clickInfo = $rawValue | ConvertFrom-Json
                $signupClicked = [bool]$clickInfo.found
                $signupClickDetail = "totalTextMatches=$($clickInfo.totalTextMatches) visibleTextMatches=$($clickInfo.visibleTextMatches) id=$($clickInfo.id)"
              } catch {
                $signupClickDetail = "CDP eval threw: $($_.Exception.Message)"
                Write-Host "::error::CDP click of the Sign up button failed: $($_.Exception.Message)"
              }
            } else {
              Write-Host "::error::DevTools endpoint at 127.0.0.1:9222 never listed a page target within 30s. If Electron is refusing --remote-debugging-port on the packaged build, this step needs a PowerShell UIAutomation fallback instead of CDP."
            }

            if (-not $signupClicked) {
              # ★ A MISSING OR UNCLICKABLE BUTTON IS ITSELF A REAL FAILURE --
              # this is the exact shape of both prior Store rejections. Do not
              # let this pass quietly; the final gate step below fails the run.
              Write-Host "::error::Could not find and click a visible 'Sign up' control ($signupClickDetail). This is exactly what caused two Store rejections: a dead auth-gate button."
            } else {
              Write-Host "Clicked Sign up ($signupClickDetail)"
            }
            "SIGNUP_CLICKED=$signupClicked" >> $env:GITHUB_ENV

            # Give the main process a moment to run startDesktopSignIn and flush
            # its console.log line to the redirected stdout file before it is
            # read below. shell.openExternal() may be slow or fail entirely on
            # a headless runner with no default browser -- that is fine, the
            # assertion below only depends on the console.log call that happens
            # BEFORE openExternal is even invoked (see windows-app/main.js's
            # startDesktopSignIn).
            Start-Sleep -Seconds 3

            try {
              Add-Type -AssemblyName System.Windows.Forms,System.Drawing
              $bAfter = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmpAfter = New-Object System.Drawing.Bitmap $bAfter.Width, $bAfter.Height
              $gAfter = [System.Drawing.Graphics]::FromImage($bmpAfter)
              $gAfter.CopyFromScreen($bAfter.Location, [System.Drawing.Point]::Empty, $bAfter.Size)
              $bmpAfter.Save((Join-Path $PWD 'installed-app-after-signup-click.png'), [System.Drawing.Imaging.ImageFormat]::Png)
              $gAfter.Dispose(); $bmpAfter.Dispose()
            } catch { Write-Host "::warning::post-click screenshot failed: $($_.Exception.Message)" }
          } else {
            Write-Host "::warning::Skipping the Sign up click - the app was not still running."
            $devtoolsReady = $false
            $signupClicked = $false
            "DEVTOOLS_READY=False" >> $env:GITHUB_ENV
            "SIGNUP_CLICKED=False" >> $env:GITHUB_ENV
          }

          Write-Host "----- stdout -----"; if (Test-Path $out) { Get-Content $out }
          Write-Host "----- stderr -----"; if (Test-Path $err) { Get-Content $err }

          # ★ "Still running" is NOT "working". Electron shows a modal
          # "A JavaScript error occurred in the main process" dialog and KEEPS
          # THE PROCESS ALIVE, so a main-process throw scores as a pass on the
          # liveness check alone. That exact false green happened on the first
          # run of this workflow: the installer was fixed, the job went green,
          # and only the screenshot showed the app sitting on a fatal
          # "Cannot find module './export-builders'" dialog.
          $crashText = ""
          foreach ($f in @($out, $err)) {
            if (Test-Path $f) { $crashText += (Get-Content $f -Raw -ErrorAction SilentlyContinue) }
          }
          $fatalPatterns = @(
            'A JavaScript error occurred',
            'Uncaught Exception',
            'Cannot find module'
          )
          $fatal = $false
          foreach ($pat in $fatalPatterns) {
            if ($crashText -match [regex]::Escape($pat)) {
              Write-Host "::error::Fatal startup error detected in output: $pat"
              $fatal = $true
            }
          }

          # ★★ THE ASSERTION THIS WHOLE EXTENSION EXISTS FOR. A click landing
          # is not enough by itself -- main.js could handle the bridge message
          # and still build a broken URL. startDesktopSignIn() (main.js) logs
          # the exact URL it is about to hand to shell.openExternal:
          #   console.log('[auth] opening desktop sign-in:', loginUrl)
          # Check three things against that one line:
          #   /signup                        -> start_signup routed to the
          #                                      SIGNUP path, not silently
          #                                      falling back to LOGIN_PATH
          #   code_challenge=                -> a PKCE challenge is present
          #   code_challenge_method=S256     -> using the S256 method
          # Windows never sent PKCE before this fix, and the server REJECTS
          # any desktop sign-in that arrives without it -- users experienced
          # that rejection as "your app version is out of date" even though a
          # browser had, by then, at least opened.
          $signupLogOk = $false
          $signupFailReason = ''
          # ★ Use the LOCAL $signupClicked variable, not $env:SIGNUP_CLICKED --
          # the "SIGNUP_CLICKED=..." >> $env:GITHUB_ENV write above only takes
          # effect for steps AFTER this one finishes; within this same script
          # $env:SIGNUP_CLICKED is still whatever it was when the process
          # started (i.e. unset), so it must not be read here.
          if ($signupClicked) {
            $signInLine = ($crashText -split "`n") | Where-Object { $_ -match '\[auth\] opening desktop sign-in:' } | Select-Object -Last 1
            if (-not $signInLine) {
              $signupFailReason = "No '[auth] opening desktop sign-in:' line in stdout after clicking Sign up. startDesktopSignIn() never ran, or the bridge message was dropped again -- the exact silent-failure shape of the two prior Store rejections."
            } else {
              Write-Host "sign-in log line: $signInLine"
              $urlMatch = [regex]::Match($signInLine, '\[auth\] opening desktop sign-in:\s*(\S+)')
              $signInUrl = if ($urlMatch.Success) { $urlMatch.Groups[1].Value } else { '' }
              # ⚠ DECODE BEFORE MATCHING. The PKCE parameters ride inside the `next=`
              # query parameter, so they arrive percent-encoded:
              #   ...next=%2Fdesktop-auth%2F...%26code_challenge%3DZXZ...
              # A literal search for `code_challenge=` finds nothing and reports a missing
              # PKCE handshake on a build whose handshake is perfectly correct -- which is
              # exactly what the first run of this check did on 2026-08-06. The app was
              # right and the assertion was wrong.
              # Unescape until it stops changing; do not hard-code the nesting depth.
              $decodedUrl = $signInUrl
              for ($d = 0; $d -lt 5; $d++) {
                $nextUrl = [System.Uri]::UnescapeDataString($decodedUrl)
                if ($nextUrl -eq $decodedUrl) { break }
                $decodedUrl = $nextUrl
              }
              if (-not $signInUrl) {
                $signupFailReason = "Found the sign-in log line but could not parse a URL out of it: $signInLine"
              } elseif ($decodedUrl -notmatch '/signup') {
                $signupFailReason = "The sign-in URL does not contain /signup ($signInUrl) - start_signup is routing to the LOGIN path instead of the SIGNUP path."
              } elseif ($decodedUrl -notmatch 'code_challenge=') {
                $signupFailReason = "The sign-in URL is missing code_challenge= ($signInUrl) - the PKCE handshake is not in the authorize URL; the server will reject this sign-in."
              } elseif ($decodedUrl -notmatch 'code_challenge_method=S256') {
                $signupFailReason = "The sign-in URL is missing code_challenge_method=S256 ($signInUrl) - PKCE is present but not using the S256 method the server requires; the server will reject this sign-in."
              } else {
                $signupLogOk = $true
                Write-Host "Sign-in URL carries /signup + code_challenge + code_challenge_method=S256: $signInUrl"
              }
            }
          } else {
            $signupFailReason = "Sign up was never clicked (see the DEVTOOLS_READY/SIGNUP_CLICKED diagnostics above), so there is nothing to assert about the sign-in URL."
          }
          "SIGNUP_LOG_OK=$signupLogOk" >> $env:GITHUB_ENV
          "SIGNUP_FAIL_REASON=$signupFailReason" >> $env:GITHUB_ENV

          if (-not $alive) {
            Write-Host "::error::THE INSTALLED APP EXITED ON ITS OWN (exit code $($p.ExitCode)) - this reproduces the Store rejection."
          } else {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          "ALIVE=$alive" >> $env:GITHUB_ENV
          "FATAL=$fatal" >> $env:GITHUB_ENV

      - name: Windows Application event log (where a startup throw actually lands)
        id: eventlog
        if: always()
        shell: pwsh
        run: |
          $since = (Get-Date).AddMinutes(-10)
          $ev = Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$since} -ErrorAction SilentlyContinue |
                Where-Object { $_.LevelDisplayName -in @('Error','Warning') -and $_.Message -match 'MyLinedChart|Application Error|Faulting' }
          if ($ev) {
            $ev | Select-Object TimeCreated,Id,LevelDisplayName,Message | Format-List
            # ★ The Electron "A JavaScript error occurred in the main process"
            # dialog does NOT reliably reach the process's stdout/stderr — three
            # runs scored GREEN while the app sat on a fatal
            # "Cannot find module './export-builders'" dialog, because the text
            # only ever appeared here. Scan the event log too, or the gate lies.
            $joined = ($ev | ForEach-Object { $_.Message }) -join "`n"
            foreach ($pat in @('A JavaScript error occurred','Cannot find module','Uncaught Exception')) {
              if ($joined -match [regex]::Escape($pat)) {
                Write-Host "::error::Fatal startup error found in the Application event log: $pat"
                "FATAL=True" >> $env:GITHUB_ENV
              }
            }
          }
          else { Write-Host "no matching Application-log entries" }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-smoke
          path: |
            installed-app.png
            installed-app-after-signup-click.png
            installed-stdout.log
            installed-stderr.log
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the run if the app did not survive
        if: always()
        shell: pwsh
        run: |
          if ($env:ALIVE -ne 'True') { throw "Installed app did not stay running." }
          if ($env:FATAL -eq 'True') { throw "Installed app stayed running but reported a fatal startup error (see the log and screenshot)." }

          # ★★ These three gate the actual reason this workflow was extended.
          # "Still running" and "no fatal error" were BOTH green on the two
          # builds Microsoft rejected for a dead "Sign up" button -- neither
          # check says anything about whether that button works. Only these do.
          if ($env:DEVTOOLS_READY -ne 'True') {
            throw "Chrome DevTools endpoint at 127.0.0.1:9222 never listed a page target - could not verify the Sign up button at all. If --remote-debugging-port is being refused by the packaged build, this workflow needs a UIAutomation-based fallback instead of CDP."
          }
          if ($env:SIGNUP_CLICKED -ne 'True') {
            throw "No visible 'Sign up' control was found and clicked. This is exactly the shape of both prior Store rejections: a dead or missing auth-gate button."
          }
          if ($env:SIGNUP_LOG_OK -ne 'True') {
            throw "Clicking Sign up did not produce a valid PKCE sign-in URL: $env:SIGNUP_FAIL_REASON"
          }
          Write-Host "Installed app launched, stayed running, reported no fatal startup error, and clicking Sign up drove a real /signup PKCE (S256) sign-in URL."
