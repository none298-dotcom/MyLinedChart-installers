name: Smoke test INSTALLED Windows app

# ★ WHY THIS EXISTS — Microsoft failed certification on 2026-07-30 with
# "10.1.2.10 Functionality — The product crashes at launch", while our existing
# smoke test was green on every build.
#
# Both can be true, because they test DIFFERENT THINGS:
#   smoke-test-windows.yml  ->  node_modules\electron\dist\electron.exe .
#                               i.e. Electron run against the SOURCE FOLDER.
#   Microsoft               ->  install the .exe, then run the INSTALLED binary.
#
# Everything that only exists after packaging — asar packing, extraResources
# copying, resourcesPath layout, files: globs in electron-builder.yml — is
# invisible to the source run and fatal to the installed one. We had no test
# covering the artifact we actually ship.
#
# This workflow does what the certifier does: silent-install, launch the
# installed exe, and prove it is still alive. It also collects the Windows
# Application event log, because an Electron main-process throw at startup
# leaves an Application Error / .NET Runtime entry there and nowhere else.

on:
  workflow_dispatch:
    inputs:
      exe_url:
        description: "Direct URL of the installer to test (defaults to the beta release asset)"
        # ★ `latest` is the only release tag now. The "beta" tag was retired on
        # 2026-08-03 because the site downloaded from `latest` while the build
        # workflows published to `beta`, so the site served a stale EXE for two
        # days. A smoke test defaulting to the dead tag would happily certify an
        # installer nobody ships.
        default: "https://github.com/none298-dotcom/MyLinedChart-installers/releases/download/latest/MyLinedChart-Windows-Setup.exe"
        required: false
      wait_seconds:
        description: "How long to let the app run before judging it alive"
        default: "40"
        required: false
      runner:
        description: "Runner image — the NSIS System.dll crash may be OS-specific"
        default: "windows-latest"
        required: false
        type: choice
        options: ["windows-latest", "windows-2022", "windows-2025"]

permissions:
  contents: read

jobs:
  installed-smoke:
    runs-on: ${{ inputs.runner || 'windows-latest' }}
    steps:
      - name: Report the runner OS
        shell: pwsh
        run: |
          Write-Host (Get-CimInstance Win32_OperatingSystem | Select-Object -ExpandProperty Caption)
          Write-Host "build: $([System.Environment]::OSVersion.Version)"

      - name: Download the installer
        shell: pwsh
        run: |
          $url = "${{ inputs.exe_url }}"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile setup.exe -UseBasicParsing
          $f = Get-Item setup.exe
          Write-Host ("installer: {0:N0} bytes ({1:N1} MB)" -f $f.Length, ($f.Length/1MB))
          if ($f.Length -lt 1MB) { throw "Installer suspiciously small - did the URL redirect to an error page?" }

      - name: Verify it is Authenticode signed
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature .\setup.exe
          Write-Host "status : $($sig.Status)"
          Write-Host "signer : $($sig.SignerCertificate.Subject)"
          # Not fatal: an unsigned build is still worth crash-testing, and the
          # signing status is checked properly by the release workflow.
          if ($sig.Status -ne 'Valid') { Write-Host "::warning::signature is $($sig.Status)" }

      - name: Silent install (exactly what the Store certifier runs)
        shell: pwsh
        run: |
          # /S is uppercase - NSIS is case sensitive and lowercase silently opens
          # the interactive installer instead, which then hangs the job.
          $p = Start-Process -FilePath .\setup.exe -ArgumentList '/S' -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Silent install failed with exit code $($p.ExitCode)" }

      # ★★ The two things Microsoft certification actually checks. Added after
      # the 2026-08-03 rejection, which failed BOTH:
      #   10.1.2.10  "no accessible method of being launched"
      #   10.2.7     "no entry in the Add or Remove Programs list"
      # Neither was an app defect — the installer was per-user, so shortcuts and
      # the uninstall key lived in the installing user's profile where a
      # certifier inspecting the machine never saw them. Asserting both here is
      # the only way to know the fix holds without waiting days for a re-review.
      - name: Assert a Start Menu shortcut exists (policy 10.1.2.10)
        shell: pwsh
        run: |
          $roots = @(
            "$env:ProgramData\Microsoft\Windows\Start Menu\Programs",
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
          )
          $found = @()
          foreach ($r in $roots) {
            if (-not (Test-Path $r)) { continue }
            $found += Get-ChildItem $r -Recurse -Filter 'MyLinedChart*.lnk' -ErrorAction SilentlyContinue
          }
          if (-not $found) {
            Write-Host "::error::No MyLinedChart Start Menu shortcut. This is exactly what certification 10.1.2.10 rejected."
            foreach ($r in $roots) { if (Test-Path $r) { Write-Host "--- $r"; Get-ChildItem $r -Recurse -Filter '*.lnk' -EA SilentlyContinue | Select-Object -First 25 FullName } }
            exit 1
          }
          $found | ForEach-Object { Write-Host "shortcut: $($_.FullName)" }
          # ALL USERS is what a certifier sees. A shortcut only under APPDATA is
          # the per-user install that failed, so warn loudly rather than pass.
          $allUsers = $found | Where-Object { $_.FullName -like "$env:ProgramData*" }
          if (-not $allUsers) {
            Write-Host "::error::Shortcut exists only in the per-user Start Menu. perMachine must be true."
            exit 1
          }

      - name: Assert an Add or Remove Programs entry exists (policy 10.2.7)
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $entry = $null
          foreach ($k in $keys) {
            $entry = Get-ItemProperty $k -ErrorAction SilentlyContinue |
                     Where-Object { $_.DisplayName -like '*MyLinedChart*' } | Select-Object -First 1
            if ($entry) { break }
          }
          if (-not $entry) {
            Write-Host "::error::No HKLM uninstall entry. This is exactly what certification 10.2.7 rejected."
            Write-Host "--- HKCU (where a per-user install would have written it) ---"
            Get-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue |
              Where-Object { $_.DisplayName -like '*MyLinedChart*' } |
              Select-Object DisplayName,UninstallString | Format-List
            exit 1
          }
          Write-Host "ARP DisplayName:     $($entry.DisplayName)"
          Write-Host "ARP UninstallString: $($entry.UninstallString)"
          if (-not $entry.UninstallString) {
            Write-Host "::error::Uninstall entry has no UninstallString — nothing for the user to run."
            exit 1
          }

      - name: Locate the installed binary
        id: locate
        shell: pwsh
        run: |
          # electron-builder NSIS defaults to a per-user install under LOCALAPPDATA.
          # Search both that and Program Files so a config change does not silently
          # turn this step into a false pass.
          $roots = @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}")
          $exe = $null
          foreach ($r in $roots) {
            if (-not (Test-Path $r)) { continue }
            $hit = Get-ChildItem $r -Recurse -Filter 'MyLinedChart.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $exe = $hit.FullName; break }
          }
          if (-not $exe) {
            Write-Host "::error::Installed MyLinedChart.exe not found after a successful install."
            foreach ($r in $roots) { if (Test-Path $r) { Get-ChildItem $r -ErrorAction SilentlyContinue | Select-Object -First 20 | Format-Table Name } }
            exit 1
          }
          Write-Host "installed exe: $exe"
          "exe=$exe" >> $env:GITHUB_OUTPUT
          $dir = Split-Path $exe -Parent
          Write-Host "--- resources\ (what actually shipped) ---"
          Get-ChildItem (Join-Path $dir 'resources') -ErrorAction SilentlyContinue | Format-Table Name,Length

      - name: Launch the INSTALLED app and prove it stays alive
        shell: pwsh
        run: |
          $exe = "${{ steps.locate.outputs.exe }}"
          $wait = [int]"${{ inputs.wait_seconds }}"
          $out = Join-Path $PWD 'installed-stdout.log'
          $err = Join-Path $PWD 'installed-stderr.log'
          # ELECTRON_ENABLE_LOGGING surfaces renderer console output on stderr,
          # which is where a bundled-chart failure shows up.
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds $wait

          $alive = -not $p.HasExited
          Write-Host "still running after ${wait}s: $alive"

          try {
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $PWD 'installed-app.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          } catch { Write-Host "::warning::screenshot failed: $($_.Exception.Message)" }

            # ★★ A VISIBLE WINDOW, not just a live process. The app now uses
            # show:false + 'ready-to-show' so launch does not flash an empty
            # window. That is a real improvement AND a real hazard: if
            # ready-to-show never fires, the process lives forever with NOTHING
            # on screen and every check above still passes. MainWindowHandle is
            # 0 until a window is actually shown, so this is what separates
            # "running" from "the user can see it".
            $p.Refresh()
            Write-Host "main window handle: $($p.MainWindowHandle)"
            Write-Host "main window title:  $($p.MainWindowTitle)"
            if ($alive -and $p.MainWindowHandle -eq 0) {
              Write-Host "::error::Running but NO visible window (MainWindowHandle=0). A ready-to-show that never fires looks exactly like this."
              exit 1
            }

          Write-Host "----- stdout -----"; if (Test-Path $out) { Get-Content $out }
          Write-Host "----- stderr -----"; if (Test-Path $err) { Get-Content $err }

          # ★ "Still running" is NOT "working". Electron shows a modal
          # "A JavaScript error occurred in the main process" dialog and KEEPS
          # THE PROCESS ALIVE, so a main-process throw scores as a pass on the
          # liveness check alone. That exact false green happened on the first
          # run of this workflow: the installer was fixed, the job went green,
          # and only the screenshot showed the app sitting on a fatal
          # "Cannot find module './export-builders'" dialog.
          $crashText = ""
          foreach ($f in @($out, $err)) {
            if (Test-Path $f) { $crashText += (Get-Content $f -Raw -ErrorAction SilentlyContinue) }
          }
          $fatalPatterns = @(
            'A JavaScript error occurred',
            'Uncaught Exception',
            'Cannot find module'
          )
          $fatal = $false
          foreach ($pat in $fatalPatterns) {
            if ($crashText -match [regex]::Escape($pat)) {
              Write-Host "::error::Fatal startup error detected in output: $pat"
              $fatal = $true
            }
          }

          if (-not $alive) {
            Write-Host "::error::THE INSTALLED APP EXITED ON ITS OWN (exit code $($p.ExitCode)) - this reproduces the Store rejection."
          } else {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          "ALIVE=$alive" >> $env:GITHUB_ENV
          "FATAL=$fatal" >> $env:GITHUB_ENV

      - name: Windows Application event log (where a startup throw actually lands)
        id: eventlog
        if: always()
        shell: pwsh
        run: |
          $since = (Get-Date).AddMinutes(-10)
          $ev = Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$since} -ErrorAction SilentlyContinue |
                Where-Object { $_.LevelDisplayName -in @('Error','Warning') -and $_.Message -match 'MyLinedChart|Application Error|Faulting' }
          if ($ev) {
            $ev | Select-Object TimeCreated,Id,LevelDisplayName,Message | Format-List
            # ★ The Electron "A JavaScript error occurred in the main process"
            # dialog does NOT reliably reach the process's stdout/stderr — three
            # runs scored GREEN while the app sat on a fatal
            # "Cannot find module './export-builders'" dialog, because the text
            # only ever appeared here. Scan the event log too, or the gate lies.
            $joined = ($ev | ForEach-Object { $_.Message }) -join "`n"
            foreach ($pat in @('A JavaScript error occurred','Cannot find module','Uncaught Exception')) {
              if ($joined -match [regex]::Escape($pat)) {
                Write-Host "::error::Fatal startup error found in the Application event log: $pat"
                "FATAL=True" >> $env:GITHUB_ENV
              }
            }
          }
          else { Write-Host "no matching Application-log entries" }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-smoke
          path: |
            installed-app.png
            installed-stdout.log
            installed-stderr.log
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the run if the app did not survive
        if: always()
        shell: pwsh
        run: |
          if ($env:ALIVE -ne 'True') { throw "Installed app did not stay running." }
          if ($env:FATAL -eq 'True') { throw "Installed app stayed running but reported a fatal startup error (see the log and screenshot)." }
          Write-Host "Installed app launched, stayed running, and reported no fatal startup error."
