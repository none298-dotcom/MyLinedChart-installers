name: Build Linux Snap
# Builds the Linux AppImage from a private-repo ref, launches it on a virtual
# display, and uploads screenshots. Test only: nothing is published.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Private-repo branch/tag/SHA to build"
        default: "main"
        required: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: none298-dotcom/MyLinedChart
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y -q libfuse2t64 && sudo snap install snapcraft --classic
      - name: Install
        working-directory: windows-app
        run: npm ci
      - name: Build Snap
        working-directory: windows-app
        run: |
          node scripts/write-store-edition-flag.js store
          npx electron-builder --config electron-builder.linux.yml --linux snap --x64 --publish never -c.extraMetadata.name=mylinedchart
          ls -la dist-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-snap
          path: windows-app/dist-linux/*.snap
